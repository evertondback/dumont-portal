<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Little Sample App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 2rem auto;
      max-width: 640px;
      padding: 0 1rem;
      line-height: 1.5;
    }
    .app {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 1rem;
    }
    .row {
      display: flex;
      gap: 0.5rem;
    }
    input[type="text"] {
      flex: 1;
      padding: 0.5rem;
      border: 1px solid #bbb;
      border-radius: 6px;
    }
    button {
      padding: 0.5rem 0.75rem;
      border: 1px solid #999;
      border-radius: 6px;
      background: #f5f5f5;
      cursor: pointer;
    }
    ul { padding-left: 1.25rem; }
    li { margin: 0.4rem 0; }
    .done { text-decoration: line-through; color: #666; }
    .muted { color: #666; font-size: 0.9rem; }
  </style>
</head>
<body>
  <h1>Little Sample App</h1>
  <p class="muted">A tiny to-do list that runs entirely in your browser.</p>

  <div class="app">
    <div class="row">
      <input id="taskInput" type="text" placeholder="Add a task (e.g., Call supplier)">
      <button id="addTaskBtn" type="button">Add</button>
    </div>
    <ul id="taskList"></ul>
    <p id="emptyState" class="muted">No tasks yet. Add one above.</p>
  </div>

  <p><a href="index.html">Back to home</a></p>

  <script>
    const taskInput = document.getElementById('taskInput');
    const addTaskBtn = document.getElementById('addTaskBtn');
    const taskList = document.getElementById('taskList');
    const emptyState = document.getElementById('emptyState');

    function updateEmptyState() {
      emptyState.style.display = taskList.children.length ? 'none' : 'block';
    }

    function addTask() {
      const text = taskInput.value.trim();
      if (!text) return;

      const li = document.createElement('li');
      const label = document.createElement('span');
      label.textContent = text;

      const toggleBtn = document.createElement('button');
      toggleBtn.type = 'button';
      toggleBtn.textContent = 'Done';
      toggleBtn.style.marginLeft = '0.5rem';
      toggleBtn.onclick = () => {
        label.classList.toggle('done');
        toggleBtn.textContent = label.classList.contains('done') ? 'Undo' : 'Done';
      };

      const removeBtn = document.createElement('button');
      removeBtn.type = 'button';
      removeBtn.textContent = 'Remove';
      removeBtn.style.marginLeft = '0.5rem';
      removeBtn.onclick = () => {
        li.remove();
        updateEmptyState();
      };

      li.appendChild(label);
      li.appendChild(toggleBtn);
      li.appendChild(removeBtn);
      taskList.appendChild(li);

      taskInput.value = '';
      taskInput.focus();
      updateEmptyState();
    }

    addTaskBtn.addEventListener('click', addTask);
    taskInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') addTask();
    });

    updateEmptyState();
  </script>
</body>
</html>
